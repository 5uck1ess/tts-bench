name: Rebuild pages

# Merges that change what the site shows (score CSVs, page code) used to sit
# unpublished until someone remembered to run publish.py by hand. This job
# rebuilds the top-level pages from the canonical dirs already on gh-pages and
# pushes the result, so those merges go live on their own.
#
# It does not publish new bench rows: results/ is gitignored, so new runs still
# go up from a rig with publish.py. hosted.html is left as-is here (its
# sidecars live only on the Windows collector; build_hosted() skips without them).

on:
  push:
    branches: [master]
    # Everything the page builders read or import: publish.py -> report.py
    # (-> bench.py PROMPTS, harness.py) and scripts/hosted/catalog.py (Scores).
    paths:
      - publish.py
      - report.py
      - harness.py
      - bench.py
      - "scripts/hosted/*.py"
      - "scoring/*.csv"
      - "scoring/*.py"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Only master runs share the publish queue. A dispatch from any other branch gets
# its own throwaway group, so it can't replace a pending master rebuild (its job
# is skipped by the guard below anyway).
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'gh-pages-rebuild' || format('gh-pages-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  rebuild:
    # Only publish from master; a manual dispatch from any other branch is a no-op.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0   # full master history: the guard below checks ancestry

      - uses: actions/setup-python@v7
        with:
          # 3.12+: sum() changed its float rounding in 3.12, and the rigs publish
          # with 3.12+; 3.11 shifts a few averaged metrics by one in the last digit.
          python-version: "3.12"
          cache: pip

      - name: Install developer dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Rebuild top-level pages and push
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A rig may push to gh-pages while this runs; on a rejected push, start
          # over from the new tip (never force, never rebase: the pages are generated).
          for attempt in 1 2 3 4 5; do
            # Fetch gh-pages BEFORE master. Anything already on gh-pages was built
            # from a master no newer than the one fetched next, so this build can
            # never render older score CSVs over newer published ones.
            git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages
            # Build from the CURRENT master tip, not the SHA this run started on:
            # a re-run would otherwise rebuild from stale code/CSVs.
            git fetch origin +master:refs/remotes/origin/master
            git checkout -q --detach origin/master
            built_from=$(git rev-parse HEAD)
            msg="Rebuild pages: $(git log -1 --format='%h %s')"
            git worktree remove --force _gh-pages 2>/dev/null || rm -rf _gh-pages
            git worktree prune
            # Full checkout, wavs included: the Listen and Scores builders only
            # list clips whose wav exists, so a wav-less checkout drops rows.
            git worktree add -B gh-pages _gh-pages origin/gh-pages

            # publish.py records the commit each publish was built from. If the last
            # publish came from a commit not on master yet, or from uncommitted score
            # or page edits, a rebuild from master would roll those numbers back:
            # skip and leave it to the next publish from merged master.
            marker=_gh-pages/.built-from.json
            if [ -f "$marker" ]; then
              read -r pub_sha pub_dirty < <(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('sha') or 'none', str(d.get('dirty', True)).lower())" "$marker" | tr -d '\r')
              if [ "$pub_dirty" != "false" ] || ! git merge-base --is-ancestor "$pub_sha" origin/master 2>/dev/null; then
                echo "::warning::gh-pages was last published from $pub_sha (uncommitted edits: $pub_dirty), which is not on master. Skipping the rebuild so those published numbers are not rolled back."
                exit 0
              fi
            fi

            python publish.py --rebuild-pages

            git -C _gh-pages add -A
            # The marker changes on every build; only a page change is worth a commit.
            if git -C _gh-pages diff --cached --quiet -- . ':(exclude).built-from.json'; then
              echo "Pages already up to date."
              exit 0
            fi
            git -C _gh-pages diff --cached --stat
            git -C _gh-pages commit -q -m "$msg"

            # If master moved while building, this output may already be stale:
            # start over from the new tip rather than push it.
            git fetch --depth=1 origin +master:refs/remotes/origin/master
            if [ "$(git rev-parse origin/master)" != "$built_from" ]; then
              echo "master moved during the build (attempt $attempt); rebuilding from the new tip."
              continue
            fi
            if git -C _gh-pages push origin gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); retrying from the new gh-pages tip."
            sleep 10
          done
          echo "Could not publish after 5 attempts." >&2
          exit 1

      # Pushes made with GITHUB_TOKEN do not trigger a Pages build, so request one
      # explicitly. It runs even when nothing changed, so re-running the job after
      # a failed build request still deploys; and a failed request fails the job.
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
