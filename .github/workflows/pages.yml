name: Rebuild pages

# CI is the ONLY writer of the top-level pages (index/listen/speed/scores/
# capabilities/archive + logos). Rigs publish only their own run dirs and the
# Windows collector only hosted.html + hosted/ (see publish.py). With one writer
# per file, nothing can push pages built from scores master doesn't have, and this
# job can't roll back anything a rig pushed.
#
# Runs when master changes a page input, when a rig asks for it after publishing
# a run dir (publish.py calls `gh workflow run`), and every 30 minutes as a
# catch-up that exits early when the pages already match master + gh-pages.

on:
  push:
    branches: [master]
    # Everything the page builders read or import: publish.py -> report.py
    # (-> bench.py PROMPTS, harness.py) and scripts/hosted/catalog.py (Scores).
    paths:
      - publish.py
      - report.py
      - harness.py
      - bench.py
      - "scripts/hosted/*.py"
      - "scoring/*.csv"
      - "scoring/*.py"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pages: write

# Only master runs share the publish queue. A dispatch from any other branch gets
# its own throwaway group, so it can't replace a pending master rebuild (its job
# is skipped by the guard below anyway).
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'gh-pages-rebuild' || format('gh-pages-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  rebuild:
    # Only publish from master; a manual dispatch from any other branch is a no-op.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_DOTENV_DISABLED: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      # Cheap check before the ~1.7 GB gh-pages checkout: if the newest gh-pages
      # commit is this job's own rebuild of the current master tip, nothing has
      # changed since (any rig publish or master change would be newer).
      - name: Check whether a rebuild is needed
        id: need
        run: |
          set -euo pipefail
          master=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" -q .sha)
          tip_msg=$(gh api "repos/${GITHUB_REPOSITORY}/commits/gh-pages" -q .commit.message)
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$tip_msg" = "Rebuild pages from master $master" ]; then
            echo "Pages already built from master $master; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.need.outputs.run == 'true'
        with:
          ref: master

      - uses: actions/setup-python@v7
        if: steps.need.outputs.run == 'true'
        with:
          # 3.12+: sum() changed its float rounding in 3.12, and the rigs build
          # with 3.12+; 3.11 shifts a few averaged metrics by one in the last digit.
          python-version: "3.12"
          cache: pip

      - name: Install developer dependencies
        if: steps.need.outputs.run == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Rebuild top-level pages and push
        if: steps.need.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A rig may push its run dir while this runs; on a rejected push, start
          # over from the new tip (never force, never rebase: the pages are generated).
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages
            # Build from the CURRENT master tip, not the SHA this run started on:
            # a re-run would otherwise rebuild from stale code/CSVs.
            git fetch --depth=1 origin +master:refs/remotes/origin/master
            git checkout -q --detach origin/master
            built_from=$(git rev-parse HEAD)
            git worktree remove --force _gh-pages 2>/dev/null || rm -rf _gh-pages
            git worktree prune
            # Full checkout, wavs included: the Listen and Scores builders only
            # list clips whose wav exists, so a wav-less checkout drops rows.
            git worktree add -B gh-pages _gh-pages origin/gh-pages

            python publish.py --rebuild-pages

            # Stage only CI's own files: root-level pages and logos. Run dirs belong
            # to the rigs, hosted.html + hosted/ to the Windows collector.
            git -C _gh-pages add -A -- ':(glob)*' ':(exclude)hosted.html'
            msg="Rebuild pages from master $built_from"
            if git -C _gh-pages diff --cached --quiet; then
              if [ "$(git -C _gh-pages log -1 --format=%s)" = "$msg" ]; then
                echo "Pages already up to date."
                exit 0
              fi
              # Nothing changed, but record that this state was checked (an empty
              # commit) so the half-hourly catch-up can skip the big checkout.
              echo "Pages already up to date; recording the check."
              git -C _gh-pages commit -q --allow-empty -m "$msg"
            else
              git -C _gh-pages diff --cached --stat
              git -C _gh-pages commit -q -m "$msg"
            fi

            # If master moved while building, this output may already be stale:
            # start over from the new tip rather than push it.
            git fetch --depth=1 origin +master:refs/remotes/origin/master
            if [ "$(git rev-parse origin/master)" != "$built_from" ]; then
              echo "master moved during the build (attempt $attempt); rebuilding from the new tip."
              continue
            fi
            if git -C _gh-pages push origin gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); retrying from the new gh-pages tip."
            sleep 10
          done
          echo "Could not publish after 5 attempts." >&2
          exit 1

      # Pushes made with GITHUB_TOKEN do not trigger a Pages build, so request one
      # explicitly. It runs even when nothing changed, so re-running the job after
      # a failed build request still deploys; and a failed request fails the job.
      - name: Request a Pages build
        if: steps.need.outputs.run == 'true'
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
